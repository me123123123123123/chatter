<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout-container">

    <header>
        <button id="back-btn" class="btn-secondary">← Back</button>
        <span style="margin-left:10px;font-weight:bold;">Profile</span>
    </header>

    <div class="profile-card">

        <h2 id="profile-name">@Loading...</h2>

        <p id="profile-number">User #...</p>

        <p id="profile-joined">Joined ...</p>

        <div class="profile-stats">

            <div>
                <strong id="profile-posts">0</strong>
                <br>
                Posts
            </div>

            <div>
                <strong id="profile-followers">0</strong>
                <br>
                Followers
            </div>

            <div>
                <strong id="profile-following">0</strong>
                <br>
                Following
            </div>

        </div>

        <br>

        <button
            id="follow-btn"
            class="btn-primary"
            style="display:none;">
            Follow
        </button>

    </div>

    <div id="timeline"></div>

</div>

<script type="module" src="user.js"></script>

<script>
document.getElementById("back-btn").onclick = () => {
    history.back();
};
</script>

</body>
</html>
